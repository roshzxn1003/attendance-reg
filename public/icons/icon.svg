<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="210" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" fill="none" opacity="0.6"/>

  <!-- Shield Base with Glow -->
  <path d="M 256 96 C 336 96 384 128 384 176 C 384 296 296 376 256 416 C 216 376 128 296 128 176 C 128 128 176 96 256 96 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Shield Highlight -->
  <path d="M 256 116 C 320 116 360 142 360 182 C 360 282 288 352 256 388 C 224 352 152 282 152 182 C 152 142 192 116 256 116 Z" 
        fill="#1e40af" opacity="0.85"/>

  <!-- Graduation Cap Top Accent -->
  <path d="M 256 150 L 330 185 L 256 220 L 182 185 Z" fill="url(#goldGrad)"/>
  <path d="M 256 220 L 256 248 C 256 264 280 274 300 270 L 300 240 L 256 220 Z" fill="#d97706"/>
  <circle cx="330" cy="205" r="5" fill="#f59e0b"/>

  <!-- Big Crisp Checkmark -->
  <path d="M 200 285 L 240 325 L 320 240" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Period Pillars (7 indicators) -->
  <g fill="#93c5fd" opacity="0.9">
    <rect x="180" y="440" width="16" height="12" rx="4"/>
    <rect x="204" y="440" width="16" height="12" rx="4"/>
    <rect x="228" y="440" width="16" height="12" rx="4"/>
    <rect x="252" y="440" width="16" height="16" rx="4" fill="url(#goldGrad)"/>
    <rect x="276" y="440" width="16" height="12" rx="4"/>
    <rect x="300" y="440" width="16" height="12" rx="4"/>
    <rect x="324" y="440" width="16" height="12" rx="4"/>
  </g>
</svg>
